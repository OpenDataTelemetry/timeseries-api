name: ci-timeseries-api-workflow
on:
  push:
    branches:
      - develop
jobs:
  build:  
    name: build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/timeseries-api:${{ github.sha }}, ${{ secrets.DOCKERHUB_USERNAME }}/timeseries-api:latest

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v1
        with:
          kustomize-version: "3.6.1"

      - name: Configurar Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clonar repositório de manifestos
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.KUBERDET_CI_TO_PROD_TOKEN }}
        run: |
          git clone https://$REPO_ACCESS_TOKEN@github.com/Kuberdet/prod.git
          ls
          pwd
          cd prod/k8s/open-data-telemetry/timeseries-api
          ls
          pwd
          cat kustomization.yaml

      - name: Update Kubernetes resources
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          ls
          pwd
          cd prod/k8s/open-data-telemetry/timeseries-api
          ls
          pwd
          cat kustomization.yaml
          kustomize edit set image timeseries-api=$DOCKERHUB_USERNAME/timeseries-api:$GITHUB_SHA             

      - name: Commit files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd prod/k8s/open-data-telemetry/timeseries-api
          ls
          pwd
          cat kustomization.yaml
          git add kustomize.yaml
          git status
          git commit -m "rolling image to tag $GITHUB_SHA"
          git push origin main

      # - name: Push changes
      #   uses: ad-m/github-push-action@master
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}

      # - name: Push
      #   uses: ad-m/github-push-action@master
