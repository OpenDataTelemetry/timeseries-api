name: ci-timeseries-api-workflow
on:
  push:
    branches:
      - develop

env:
  # DockerHub Access
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  #Github Variables
  APP_GITHUB_SHA: ${{ github.sha }}
  APP_NAME: timeseries-api
  APP_NAMESPACE: open-data-telemetry
  # K8s Prod Repository Access
  K8S_PROD_REPO_APP_NAME: $APP_NAME
  K8S_PROD_REPO_APP_NAMESPACE: $APP_NAMESPACE
  K8S_PROD_REPO_ACCESS_TOKEN: ${{ secrets.K8S_PROD_REPO_ACCESS_TOKEN }}
  K8S_PROD_REPO_BASE_DIR: ${{ secrets.K8S_PROD_REPO_BASE_DIR }}
  K8S_PROD_REPO_KUSTOMIZATION_APP_DIR: ${{ secrets.K8S_PROD_REPO_BASE_DIR }}/$K8S_PROD_REPO_APP_NAMESPACE/$K8S_PROD_REPO_APP_NAME
  K8S_PROD_REPO_URL: ${{ secrets.K8S_PROD_REPO_URL }}
  K8S_PROD_REPO_BRANCH: ${{ secrets.K8S_PROD_REPO_BRANCH }}

jobs:
  build:  
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_TOKEN

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: $DOCKERHUB_USERNAME/$APP_NAME:$APP_GITHUB_SHA, $DOCKERHUB_USERNAME/$APP_NAME:latest

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v1
        with:
          kustomize-version: "3.6.1"

      - name: Configurar Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone K8s Prod Repository
        # env:
        #   REPO_ACCESS_TOKEN: ${{ secrets.KUBERDET_CI_TO_PROD_TOKEN }}
        #   REPO_KUSTOMIZATION_DIR: ${{ secrets.KUBERDET_KUSTOMIZATION_DIR }}
        #   REPO_K8S: ${{ secrets.KUBERDET_REPO }}
        run: |
          git clone --single-branch --branch $K8S_PROD_REPO_BRANCH https://$K8S_PROD_REPO_ACCESS_TOKEN@$K8S_PROD_REPO_URL
          cd $K8S_PROD_REPO_KUSTOMIZATION_APP_DIR
          cat kustomization.yaml

      - name: Update Kubernetes resources
        # env:
        #   DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        #   $GITHUB_SHA: ${{ github.sha }}
        run: |
          cd $K8S_PROD_REPO_KUSTOMIZATION_APP_DIR
          kustomize edit set image $APP_NAME=$DOCKERHUB_USERNAME/$APP_NAME:$APP_GITHUB_SHA
          cat kustomization.yaml           

      - name: Commit files
        # env:
        #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $K8S_PROD_REPO_KUSTOMIZATION_APP_DIR
          cat kustomization.yaml
          git add kustomization.yaml
          git status
          git commit -m "rolling $APP_NAME Docker image to tag $GITHUB_SHA"
          git push origin $K8S_PROD_REPO_BRANCH
